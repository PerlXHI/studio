<style>
:root{--bg:#f6f2ff;--surface:#fff;--ink:#241a3d;--muted:#625a78;--line:#ded5f2;--flame:#e8452c;--flame2:#f59a1f;--night:#241a3d;--on-night:#fff3e6;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f27;--surface:#20173b;--ink:#fbf3ea;--muted:#b7aed0;--line:#3a2d5e;--night:#0d0819}}
:root[data-theme="dark"]{--bg:#150f27;--surface:#20173b;--ink:#fbf3ea;--muted:#b7aed0;--line:#3a2d5e;--night:#0d0819}
*{box-sizing:border-box}html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.05;margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--flame2);outline-offset:3px}
a{color:inherit}.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:4px;height:58px;overflow-x:auto}
.logo{font:800 1.2rem "Bricolage Grotesque",sans-serif;text-decoration:none;margin-right:auto;white-space:nowrap;padding-right:12px}
nav a.l,#lg{padding:8px 12px;border-radius:99px;text-decoration:none;font:600 .92rem Figtree,sans-serif;white-space:nowrap}
nav a.l:hover{background:var(--line)}nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
#lg{border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;margin-left:6px}
.hero{background:var(--night);color:var(--on-night);position:relative;overflow:hidden;min-height:70vh;display:grid;align-items:end}
.scene{position:absolute;inset:0}.scene svg{position:absolute;inset:-4%;width:108%;height:108%;transition:transform .15s ease-out}
.hero .wrap{position:relative;z-index:2;padding-bottom:48px;padding-top:110px}
.hero h1{font-size:clamp(2.6rem,9vw,5.6rem);font-weight:800;max-width:11ch}
.hero p{max-width:46ch;color:#e9dcf5;margin:14px 0 20px}
.sbox{display:flex;gap:8px;max-width:560px;margin-bottom:16px}
input,select{font:inherit;padding:11px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.sbox input{flex:1}
.btn,.sbox button,.ctl button{padding:11px 20px;border-radius:99px;background:linear-gradient(135deg,var(--flame),var(--flame2));color:#fff;font:600 1rem Figtree,sans-serif;border:0;cursor:pointer;text-decoration:none;display:inline-block}
section.v{padding:56px 0}
h2{font-size:clamp(1.7rem,5vw,2.6rem);margin-bottom:8px}h3{font-size:1.2rem}
.sub{color:var(--muted);max-width:62ch;margin:0 0 22px}.msg{color:var(--muted);margin:0 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}
.chip{padding:8px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem Figtree,sans-serif;cursor:pointer}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.ctl input{flex:1 1 200px}
ul.list{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.art{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:1.9rem}
.info b{font-size:1.05rem}.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--line);margin:2px 6px 0 0}
small{color:var(--muted)}
.act{display:flex;align-items:center;gap:14px}.act button,.card button{padding:8px 14px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);font:600 .88rem Figtree,sans-serif;cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px;justify-items:start}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}
footer{background:var(--night);color:var(--on-night);padding:44px 0 36px}
footer .row2{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}footer a{margin-right:16px;font-weight:600}
dialog{border:0;border-radius:var(--r);padding:16px;width:min(720px,94vw);background:var(--surface);color:var(--ink)}dialog::backdrop{background:#000a}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ph button{border:0;background:var(--line);color:var(--ink);border-radius:99px;width:36px;height:36px;cursor:pointer}
.pv{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.pv iframe{width:100%;height:100%;border:0}.ph0{color:#fff;display:grid;place-items:center;height:100%;text-align:center;padding:16px}
dialog a{display:inline-block;margin-top:10px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:50;max-width:90vw}
@media(max-width:640px){.row{grid-template-columns:56px 1fr}.art{width:56px;height:56px}.act{grid-column:1/-1;justify-content:space-between}}
@media(prefers-reduced-motion:reduce){.scene svg{transition:none}}

/* ETHEREAL DREAMY STUDIO */
:root{color-scheme:light;--bg:#f7f6ff;--surface:rgba(255,255,255,.88);--ink:#292344;--muted:#77718f;--line:#e5e0f4;--flame:#8b7bd0;--flame2:#9dc8ed;--night:#e9e6fb;--on-night:#30294c;--r:22px}
body{background:radial-gradient(ellipse at 10% 4%,#e9e5ff,transparent 36%),radial-gradient(ellipse at 90% 24%,#e2f1ff,transparent 34%),linear-gradient(180deg,#fbfaff,#f5f5ff);color:var(--ink)}
header{background:rgba(250,249,255,.82);border-color:var(--line)}
.logo{color:#554b7c}nav a.l,#lg{border-radius:999px}
.hero{background:radial-gradient(ellipse at 78% 18%,#dcecffb0,transparent 34%),radial-gradient(ellipse at 12% 90%,#e9ddffb0,transparent 38%);border-radius:0 0 32px 32px}
.hero h1{color:#30294c}.hero .sub,.msg{color:var(--muted)}
.btn{border-radius:999px;background:linear-gradient(120deg,#9182d1,#8bbce4);box-shadow:0 9px 24px #8d80cb38}
.card,details{border-radius:22px;background:linear-gradient(145deg,#ffffffed,#f5f3ffdd);border-color:#e5e0f4;box-shadow:0 12px 34px #6556a00d}
.tag,.chip{border-radius:999px}
footer{background:#eae7fa;color:#383151;border-top:1px solid #ddd7f0}
#toast{background:#4b426d;color:#fff;border-radius:999px}


/* RESPONSIVE MODERN PASS */
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{min-width:320px;overflow-x:clip}
.wrap{width:min(100% - 40px,1000px)}
img,svg,iframe,video{max-width:100%}
button,a,.btn,.chip{touch-action:manipulation}
input,select,button{font-size:16px;min-width:0}
nav{scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scroll-snap-type:x proximity}
nav::-webkit-scrollbar{display:none}
.logo,nav a.l,#lg{flex-shrink:0;scroll-snap-align:start}
nav a.l,#lg{min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.sbox input{min-width:0}
.ctl>*{min-width:0}
.list,.row,.info{min-width:0}
.info{overflow-wrap:anywhere}
.cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
dialog{max-height:min(86vh,780px);overflow:auto;overscroll-behavior:contain}
@media(max-width:800px){
 .wrap{width:calc(100% - 34px)}
 .hero{min-height:62svh}
 .hero .wrap{padding-top:88px;padding-bottom:40px}
 .hero h1{font-size:clamp(2.7rem,8.5vw,4.8rem)}
 section.v{padding:46px 0}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:640px){
 html{scroll-padding-top:68px}
 .wrap{width:calc(100% - 30px)}
 header .wrap{width:100%;padding-left:15px;padding-right:15px}
 nav{height:54px;gap:4px;padding:0 0 3px}
 .logo{font-size:1.06rem;padding-right:8px}
 nav a.l,#lg{font-size:.78rem;padding:7px 10px}
 #lg{margin-left:3px}
 .hero{min-height:0;min-height:64svh;border-radius:0 0 24px 24px}
 .hero .wrap{padding-top:72px;padding-bottom:34px}
 .hero h1{font-size:clamp(2.55rem,12vw,4rem);max-width:10ch}
 .hero p{font-size:.94rem;max-width:38ch}
 .sbox{flex-direction:column;gap:9px;width:100%;max-width:100%}
 .sbox input,.sbox button{width:100%;min-height:46px}
 section.v{padding:40px 0}
 h2{font-size:clamp(1.55rem,7vw,2.15rem)}
 .chips{gap:7px;margin-bottom:22px}
 .chip{min-height:40px;padding:8px 12px}
 .ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .ctl input{grid-column:1/-1;width:100%}
 .ctl input,.ctl select,.ctl button{width:100%;min-height:45px}
 .row{grid-template-columns:52px minmax(0,1fr);gap:11px;padding:11px;border-radius:18px}
 .art{width:52px;height:52px;font-size:1.55rem}
 .act{grid-column:1/-1;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:3px}
 .act button,.card button{min-height:40px}
 .cards{grid-template-columns:1fr;gap:12px}
 .card{padding:18px}
 details{padding:12px 14px}
 footer{padding:34px 0 28px}
 footer .row2{align-items:flex-start;flex-direction:column;gap:12px}
 footer a{display:inline-block;margin:4px 12px 4px 0}
 dialog{width:calc(100% - 22px);padding:13px;border-radius:18px}
 .ph{gap:10px}
 .pv{border-radius:10px}
}
@media(max-width:380px){
 .wrap{width:calc(100% - 24px)}
 nav{gap:3px}
 .logo{font-size:.98rem}
 nav a.l,#lg{font-size:.72rem;padding:6px 8px}
 .hero h1{font-size:2.4rem}
 .ctl{grid-template-columns:1fr}
 .ctl input{grid-column:auto}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 .scene svg{transition:none}
}

var RATE=16000; // kurs Rp per $1, ubah sesuai kebutuhan
var G={musik:["BGM","Lore Music"],lagu:["OG Song"],sound:["Sound Alert","Stinger"],semua:null};
var V=["home","musik","lagu","sound","semua","komposer","tag","cari","lisensi","bantuan","riwayat"];
var $=function(s){return document.querySelector(s)};
var lang="en",st={q:"",m:"",s:"new"},cur="home",last=[],dl=$("#pl"),pv=$("#pv"),yl=$("#pyl"),AC;
function t(k){return K[k][lang==="id"?0:1]}
function mo(m){return lang==="en"?MO[m]:m}
function fmt(n){return lang==="en"?"$"+(n/RATE).toFixed(2):"Rp"+n.toLocaleString("id-ID")}
var M=T.map(function(x){return x[2]}).filter(function(v,i,a){return a.indexOf(v)===i}).sort();
var KD=T.map(function(x){return x[1]}).filter(function(v,i,a){return a.indexOf(v)===i});
function rowH(i){var x=T[i];return '<li class="row"><div class="art" style="background:'+x[5]+'33">'+x[4]+'</div><div class="info"><b>'+x[0]+'</b><div><span class="tag">'+x[1]+'</span><span class="tag">'+mo(x[2])+'</span><small>'+t("of")+' '+x[6]+'</small></div></div><div class="act"><b>'+fmt(x[3])+'</b><span><button type="button" data-i="'+i+'">'+t("pl")+'</button> <button type="button" data-b="'+i+'">'+t("by")+'</button></span></div></li>'}
function fill(el,a){el.innerHTML=a.length?a.map(rowH).join(""):'<li class="empty">'+t("em")+'</li>'}
function all(){return T.map(function(_,i){return i})}
function hist(){try{return JSON.parse(localStorage.getItem("pv_h")||"[]")}catch(e){return[]}}
function addH(i){var h=hist().filter(function(x){return x!==i});h.unshift(i);try{localStorage.setItem("pv_h",JSON.stringify(h.slice(0,20)))}catch(e){}}
function toast(m){var e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){e.hidden=true},3200)}
function go(v){if(location.hash==="#"+v)route();else location.hash=v}
function catalog(){var g=G[cur],q=st.q.toLowerCase();
last=all().filter(function(i){var x=T[i];return(!g||g.indexOf(x[1])>-1)&&(!st.m||x[2]===st.m)&&(!q||(x[0]+" "+x[1]+" "+x[2]+" "+mo(x[2])+" "+x[6]).toLowerCase().indexOf(q)>-1)});
last.sort(function(a,b){return st.s==="pop"?T[b][8]-T[a][8]:st.s==="low"?T[a][3]-T[b][3]:(T[b][7]<T[a][7]?-1:1)});
$("#ct").textContent=TT[cur][lang==="id"?0:1];$("#cn").textContent=last.length+" "+t("pr");$("#q").value=st.q;$("#sm").value=st.m;$("#ss").value=st.s;fill($("#cl"),last)}
function route(keep){var h=location.hash.slice(1),v=V.indexOf(h)>-1?h:"home";cur=v;
document.querySelectorAll(".v").forEach(function(e){if(e.id)e.hidden=true});
var id=G.hasOwnProperty(v)?"cat":v;$("#v-"+id).hidden=false;
document.querySelectorAll("nav a.l").forEach(function(a){a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false")});
if(id==="cat")catalog();
if(v==="riwayat")fill($("#hl"),hist());
if(v==="home")fill($("#hl2"),all().sort(function(a,b){return T[b][7]<T[a][7]?-1:1}).slice(0,4));
if(v==="cari"){fsearch();vsearch()}
if(!keep)scrollTo(0,0)}
function ap(){document.documentElement.lang=lang;
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=t(e.dataset.p)});
$("#fq").placeholder=t("fs").match(/“[^”]+”/)[0].replace(/[“”]/g,"");

var chips=M.map(function(m){return '<button type="button" class="chip" data-m="'+m+'">'+mo(m)+'</button>'}).join("");
$("#hm").innerHTML=chips;$("#tm").innerHTML=M.map(function(m){var n=T.filter(function(x){return x[2]===m}).length;return '<button type="button" class="chip" data-m="'+m+'">'+mo(m)+' ('+n+')</button>'}).join("");
$("#tk").innerHTML=KD.map(function(k){var n=T.filter(function(x){return x[1]===k}).length;return '<button type="button" class="chip" data-k="'+k+'">'+k+' ('+n+')</button>'}).join("");
$("#sm").innerHTML='<option value="">'+t("am")+'</option>'+M.map(function(m){return '<option value="'+m+'">'+mo(m)+'</option>'}).join("");
$("#cc").innerHTML=CR.map(function(c){var n=T.filter(function(x){return x[6]===c[0]}).length;return '<div class="card"><h3>'+c[0]+'</h3><small>'+c[lang==="id"?1:2]+'</small><span>'+n+' '+t("pr")+'</span><button type="button" data-c="'+c[0]+'">'+t("vw")+'</button></div>'}).join("");
route(1)}
function fsearch(){var tok=$("#fq").value.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean),el=$("#fr");if(!tok.length){el.innerHTML="";return}
var sc={};T.forEach(function(x,i){var s=0,h=x[0].toLowerCase();tok.forEach(function(w){if(h.indexOf(w)>-1)s++;for(var k in W){if(w.indexOf(k)>-1||(w.length>3&&k.indexOf(w)===0)){var v=W[k];if(v[0]==="m"&&x[2]===v[1])s+=2;if(v[0]==="k"&&x[1]===v[1])s+=2}}});if(s)sc[i]=s});
fill(el,Object.keys(sc).map(Number).sort(function(a,b){return sc[b]-sc[a]}))}
function vsearch(){var v=$("#vq").value.trim(),el=$("#vr"),m=$("#vm");el.innerHTML="";m.textContent="";if(!v)return;
var x=v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!x){m.textContent=t("bad");return}
var r=all().filter(function(i){return YT[i]===x[1]});if(r.length)fill(el,r);else m.textContent=t("nov")}
function play(cat){AC=AC||new (window.AudioContext||window.webkitAudioContext)();var n0=AC.currentTime;
var N={"BGM":[261.6,329.6,392,523.3,392,329.6],"Sound Alert":[880,1174.7],"Stinger":[196,293.7,440,587.3,880],"OG Song":[392,440,523.3,440,392,329.6,392],"Lore Music":[196,246.9,293.7]}[cat];
var s0=cat==="Lore Music"?.7:cat==="Sound Alert"?.12:cat==="Stinger"?.09:.22;
N.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),s=n0+i*s0,d=cat==="Lore Music"?1.2:s0*1.6;o.type=cat==="Lore Music"?"sine":cat==="Sound Alert"?"square":"triangle";o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)})}
function openP(i){var x=T[i],id=YT[i];$("#pt").textContent=x[0];addH(i);
if(id){pv.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0&autoplay=1" title="Preview" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';yl.href="https://www.youtube.com/watch?v="+id;yl.hidden=false}
else{pv.innerHTML='<div class="ph0">'+t("noyt")+'</div>';yl.hidden=true;play(x[1])}
dl.showModal()}
document.addEventListener("click",function(e){var b;
if(b=e.target.closest("[data-i]"))openP(+b.dataset.i);
else if(b=e.target.closest("[data-b]"))toast(t("tb"));
else if(b=e.target.closest("[data-m]")){st.m=b.dataset.m;st.q="";go("semua")}
else if(b=e.target.closest("[data-k]")){st.q=b.dataset.k;st.m="";go("semua")}
else if(b=e.target.closest("[data-c]")){st.q=b.dataset.c;st.m="";go("semua")}});

$("#hgo").onclick=function(){st.q=$("#hq").value;st.m="";go("semua")};
$("#hq").addEventListener("keydown",function(e){if(e.key==="Enter")$("#hgo").click()});
$("#q").oninput=function(){st.q=this.value;catalog()};
$("#sm").onchange=function(){st.m=this.value;catalog()};
$("#ss").onchange=function(){st.s=this.value;catalog()};
$("#rnd").onclick=function(){if(last.length)openP(last[Math.floor(Math.random()*last.length)]);else toast(t("nr0"))};
$("#fgo").onclick=fsearch;$("#fq").addEventListener("keydown",function(e){if(e.key==="Enter")fsearch()});
$("#vgo").onclick=vsearch;$("#vq").addEventListener("keydown",function(e){if(e.key==="Enter")vsearch()});
$("#hclr").onclick=function(){try{localStorage.removeItem("pv_h")}catch(e){}fill($("#hl"),[])};
$("#px").onclick=function(){dl.close()};
dl.addEventListener("close",function(){pv.innerHTML=""});
dl.addEventListener("click",function(e){if(e.target===dl)dl.close()});
addEventListener("hashchange",function(){route()});ap();
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){$(".hero").addEventListener("mousemove",function(e){var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;$("#scene").querySelectorAll("svg").forEach(function(s){var d=+s.dataset.d;s.style.transform="translate("+(-x*d)+"px,"+(-y*d)+"px)"})})}
</script>
