/* ETHEREAL DREAMY STUDIO */
:root{--paper:#f7f6ff;--card:rgba(255,255,255,.82);--ink:#292344;--muted:#77718f;--line:#e5e0f4;--green:#7770b8;--rust:#a58bdc;--r:20px;color-scheme:light}
body{background:radial-gradient(ellipse at 12% 8%,#e9e5ff 0,transparent 34%),radial-gradient(ellipse at 88% 28%,#e2f1ff 0,transparent 32%),linear-gradient(180deg,#fbfaff 0%,#f5f5ff 52%,#f9f7ff 100%);color:var(--ink)}
header{background:rgba(250,249,255,.78);border-color:var(--line);box-shadow:0 8px 30px #6556a00a}
.brand span,.hero h1 em{color:#8b7bd0}.navlink:hover{color:#8b7bd0}
.quiet,.cart-button{border-radius:999px;background:#ffffff9c;border-color:#ded8f2}
.hero{position:relative;border-color:var(--line);overflow:hidden;background:radial-gradient(ellipse at 82% 25%,#dcecff9c,transparent 34%),radial-gradient(ellipse at 64% 80%,#e9ddff9c,transparent 36%)}
.hero:before,.section-head:before{content:"✧";position:absolute;color:#a99be0;font-size:2rem;opacity:.65;pointer-events:none}
.hero:before{right:7%;top:12%}.hero h1{color:#30294c}.eyebrow,.mono{color:#8981a8}
.hero-art{filter:drop-shadow(0 18px 30px #9b8edb33)}
.hero-kicker{border-color:#e1dcf2;background:#ffffff8a;border-radius:999px}
.btn,.starting{border-radius:999px}.btn{box-shadow:0 8px 22px #9586d52b}
.portfolio-card,.service-card,.step-card,.credit-card,.license-panel,.product{border-radius:22px;border-color:#e5e0f4;background:linear-gradient(145deg,#ffffffed,#f5f3ffdd);box-shadow:0 12px 34px #6556a00d}
.portfolio-art,.product-art{border-radius:16px;overflow:hidden}
.mini-player{border-color:#e7e1f4}.mini-player audio{accent-color:#9586d5}
.starting{color:#8274c4;border-color:#e9e3f6}
.custom-band{background:linear-gradient(120deg,#e8e4ff,#e3f2ff)!important;color:#30294c;border:1px solid #ded8f5;border-radius:28px}
.custom-band p,.custom-band .muted{color:#716b91}
input,select,textarea{border-radius:14px;border-color:#e0daf2;background:#fff;color:var(--ink)}
footer{background:#eae7fa!important;color:#383151!important;border-top:1px solid #ddd7f0}footer p{color:#77718f!important}
.modal,.dialog{border-radius:24px;background:#fbfaff;border-color:#e3def3}
.toast{border-radius:999px;background:#4b426d}
@media(max-width:600px){.hero:before{right:4%;top:4%}}


/* DREAMY HERO ARTWORK */
.hero-art{isolation:isolate;min-height:0;aspect-ratio:1;max-width:470px;border:1px solid #fff9;border-radius:34px;background:linear-gradient(145deg,#eeeaff,#e4f1ff);box-shadow:0 28px 70px #9183c52b,inset 0 1px 0 #fff;overflow:visible}
.hero-art:before,.hero-art:after{display:none}
.hero-visual{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit;overflow:hidden}
.hero-float{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid #fff;background:#ffffffc9;box-shadow:0 12px 30px #7166a322;backdrop-filter:blur(14px);border-radius:17px;color:#554b7b;animation:hero-drift 6s ease-in-out infinite}
.hero-float b{display:block;font-size:.76rem;line-height:1.25;font-weight:700}
.hero-float small{display:block;margin-top:3px;color:#827b9d;font-size:.64rem;line-height:1.25}
.hero-float-top{top:15%;left:-7%}.hero-float-bottom{right:-6%;bottom:15%;animation-delay:-3s}
.float-symbol,.float-wave{display:grid;place-items:center;width:33px;height:33px;flex:0 0 33px;border-radius:12px;background:linear-gradient(145deg,#eee8ff,#e1f1ff);color:#8b7bd0;font-size:1.25rem}
.float-wave{font-size:1.8rem}
.hero-art-caption{position:absolute;right:7%;top:7%;z-index:2;font:500 .58rem "DM Mono",monospace;letter-spacing:.13em;color:#847aa9}
@keyframes hero-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:850px){.hero-art{max-width:390px;justify-self:center}.hero-float-top{left:-3%}.hero-float-bottom{right:-3%}}
@media(max-width:560px){.hero-art{width:min(100%,310px);justify-self:center;margin:18px auto 0;border-radius:26px}.hero-float{padding:8px 10px;gap:7px}.hero-float b{font-size:.66rem}.hero-float small{font-size:.56rem}.hero-float-top{left:-4%;top:12%}.hero-float-bottom{right:-4%;bottom:12%}.hero-art-caption{font-size:.48rem}}
@media(prefers-reduced-motion:reduce){.hero-float{animation:none}}


/* ETHEREAL CARD SYSTEM — PORTFOLIO, CATALOG & SERVICES */
:root{--dream-lavender:#8f82cf;--dream-lavender-deep:#7167ad;--dream-blue:#9fc5e8;--dream-glass:#ffffffc9;--dream-shadow:0 16px 42px #7568ad14;--dream-shadow-hover:0 22px 48px #7568ad24}
.portfolio-strip{background:linear-gradient(180deg,#f0edff 0%,#edf5ff 100%)!important;border-color:#e2ddf4}
.section-head{position:relative}
.section-head:before{right:1%;top:0;color:#aa9fe0;opacity:.52}
.portfolio-cards,.products,.service-grid{align-items:stretch}
.portfolio-card,.product,.service-card{position:relative;isolation:isolate;overflow:hidden;border:1px solid #e3def4;border-radius:26px;background:linear-gradient(145deg,#ffffffef 0%,#f5f3ffed 62%,#f0f6ffed 100%);box-shadow:var(--dream-shadow);transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease}
.portfolio-card:hover,.product:hover,.service-card:hover{transform:translateY(-6px);border-color:#d2c9f0;box-shadow:var(--dream-shadow-hover)}
.portfolio-card:before,.product:before,.service-card:before{content:"";position:absolute;z-index:-1;width:170px;height:170px;right:-78px;top:-86px;border-radius:50%;background:radial-gradient(circle,#cfc5f3a1 0%,#dceaff55 44%,transparent 72%);pointer-events:none}
.portfolio-art,.product-art{position:relative;isolation:isolate;color:#fff;background:radial-gradient(circle at 74% 25%,#ffffff55 0,transparent 26%),linear-gradient(135deg,color-mix(in srgb,var(--art) 70%,#8277bd),color-mix(in srgb,var(--art) 66%,#86b4dc));}
.portfolio-art{height:176px;padding:17px;border-radius:19px;margin:10px 10px 0}
.portfolio-art:before,.product-art:after{content:"✧";position:absolute;right:22%;top:18%;z-index:1;color:#ffffffd9;font:400 2rem "Playfair Display",serif;text-shadow:0 0 22px #fff9}
.portfolio-art:after{width:150px;height:150px;right:-20px;bottom:-92px;border-color:#ffffffa0;box-shadow:0 0 0 16px #ffffff17,0 0 0 35px #ffffff0d}
.portfolio-art span,.product-art>*{position:relative;z-index:2}
.portfolio-copy{padding:17px 19px 14px}
.portfolio-copy .eyebrow{color:#8980b1}
.portfolio-copy h3,.service-card h3{color:#393253;letter-spacing:-.025em}
.portfolio-copy p:not(.eyebrow){color:#77718f}
.mini-player{margin:0 10px 10px;padding:13px 14px;border:1px solid #e9e4f6;border-radius:17px;background:linear-gradient(135deg,#ffffffb8,#f0f4ffb8)}
.mini-player label{color:#8980b1}
.mini-player audio{accent-color:#8b7bd0}
.mini-player iframe{box-shadow:0 8px 22px #5f56851c}
.product{border-radius:26px}
.product-art{min-height:195px;padding:19px;border-radius:19px;margin:10px 10px 0}
.product-art:before{width:155px;height:155px;right:8%;bottom:-88px;border-color:#ffffff8a;box-shadow:0 0 0 17px #ffffff19,0 0 0 36px #ffffff0d}
.product-art:after{right:22%;top:18%;color:#fff;font-size:1.8rem;text-shadow:0 0 22px #fff9}
.art-type{color:#fff;text-shadow:0 1px 9px #34304b30}
.favorite{border-color:#ffffffb8;background:#ffffff2c;backdrop-filter:blur(8px)}
.favorite[aria-pressed=true]{background:#fff;color:#907fcf}
.product-body{padding:18px 19px 19px}
.product-body .eyebrow{color:#8980b1}
.product-title{color:#393253}
.product-desc,.product-meta{color:#77718f}
.product-bottom{border-color:#e9e4f6}
.price{color:#675d9e}
.small-btn{box-shadow:none}
.btn.secondary{background:#fff9;border-color:#d8d1ef;color:#7569ad}
.btn.secondary:hover{background:#eeeaff}
.service-card{padding:24px 22px 21px;min-height:225px;display:flex;flex-direction:column}
.service-card:after{content:"";position:absolute;right:-46px;bottom:-65px;width:145px;height:145px;border:1px solid #bcb0e77a;border-radius:50%;box-shadow:0 0 0 15px #c9c0ed18,0 0 0 32px #c9c0ed0d;pointer-events:none}
.service-card:before{content:"✧";z-index:0;right:20px;top:16px;width:auto;height:auto;border-radius:0;background:none;color:#a99bdb;font:400 1.4rem "Playfair Display",serif}
.service-card:nth-child(2):before{content:"☾"}.service-card:nth-child(3):before{content:"✦"}.service-card:nth-child(4):before{content:"♫"}.service-card:nth-child(5):before{content:"✧"}
.service-card>*{position:relative;z-index:1}
.service-card .eyebrow{color:#8a81b2}
.service-card h3{max-width:90%;font-size:1.35rem}

/* FLOATING CONTACT MENU — native details/summary keeps the toggle reliable without JS */
(function(){
 const widget=document.getElementById("contactWidget");
 if(!widget)return;
 function setLink(id,url,kind){
  const link=document.getElementById(id);if(!link)return;
  const value=String(url||"").trim();let target="";
  if(kind==="email"){
   if(/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value))target="mailto:"+value;
  }else if(/^https?:\\/\\//i.test(value))target=value;
  if(target){link.href=target;link.hidden=false}else{link.removeAttribute("href");link.hidden=true}
 }
 function applyLinks(links){
  links=links||{};
  setLink("contactDiscord",links.discord);
  setLink("contactVgen",links.vgen);
  setLink("contactEmail",links.email,"email");
  setLink("contactTwitter",links.twitter);
  const any=!!(links.discord||links.vgen||links.email||links.twitter);
  const empty=document.getElementById("contactEmpty");if(empty)empty.hidden=any;
 }
 window.addEventListener("perivelle:contact-ready",function(event){applyLinks(event.detail||{})});
 window.addEventListener("perivelle:contact-links",function(event){applyLinks(event.detail||{})});
 document.addEventListener("keydown",function(event){if(event.key==="Escape"&&widget.open){widget.open=false;document.getElementById("contactTrigger").focus()}});
})();

/* LOAD ADMIN-MANAGED PUBLIC STUDIO SETTINGS */
(async function(){
 try{
  const response=await fetch("/api/site-config",{headers:{"Accept":"application/json"}});
  if(!response.ok)return;
  const payload=await response.json(),settings=payload.settings||{};
  if(Array.isArray(settings.catalog_products)){
   settings.catalog_products.forEach(function(item){
    const product=products.find(function(p){return p.id===item.id});
    if(product){if(Number.isFinite(Number(item.price)))product.price=Number(item.price);product.preview=String(item.preview||"");}
   });
   renderProducts();renderCart();
  }
  if(Array.isArray(settings.service_prices)){
   document.querySelectorAll(".service-card").forEach(function(card,index){
    const item=settings.service_prices[index];
    const node=card.querySelector(".starting");
    if(item&&node)node.textContent=item.price?"STARTING AT · "+item.price:"CONTACT FOR A QUOTE";
   });
  }
  if(settings.studio_links&&settings.studio_links.discord)DISCORD_URL=settings.studio_links.discord;
  window.dispatchEvent(new CustomEvent("perivelle:contact-ready",{detail:settings.studio_links||{}}));
 }catch(error){console.warn("Public studio settings could not be loaded.");}
})();

setLanguage("en");

/* NAVBAR VIEW ROUTING: each top-level section opens as its own studio view */
(function(){
 const PAGE_BY_HASH={home:"home",portfolio:"portfolio",catalog:"catalog",services:"services",workflow:"services",credits:"services",team:"team",custom:"custom","commission-request":"custom",track:"track",license:"license",faq:"faq"};
 const PAGE_TITLES={home:"Perivelle — Original BGM for Creators",portfolio:"Portfolio — Perivelle",catalog:"Music Catalog — Perivelle",services:"Audio Services — Perivelle",team:"Our Team — Perivelle",custom:"Custom Commission — Perivelle",track:"Track Commission — Perivelle",license:"Licensing — Perivelle",faq:"FAQ — Perivelle"};
 function currentKey(){const key=(location.hash||"#home").slice(1).toLowerCase();return PAGE_BY_HASH[key]||"home"}
 function renderView(scroll){
  const key=currentKey();
  document.querySelectorAll(".page-view[data-page]").forEach(function(view){view.hidden=view.dataset.page!==key});
  document.querySelectorAll("[data-page-link]").forEach(function(link){
   const active=link.dataset.pageLink===key;
   if(active)link.setAttribute("aria-current","page");else link.removeAttribute("aria-current");
  });
  document.documentElement.dataset.activeView=key;
  document.title=PAGE_TITLES[key]||PAGE_TITLES.home;
  if(scroll)window.scrollTo({top:0,left:0,behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
 }
 document.addEventListener("click",function(event){
  const link=event.target.closest('a[href^="#"]');
  if(!link)return;
  const raw=link.getAttribute("href").slice(1).toLowerCase();
  if(!PAGE_BY_HASH[raw])return;
  event.preventDefault();
  const next="#"+raw;
  if(location.hash!==next)history.pushState({view:PAGE_BY_HASH[raw]},"",next);
  if(raw==="commission-request"){
   renderView(false);
   const target=document.getElementById("commission-request");
   if(target)target.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
   return;
  }
  renderView(true);
 });
 window.addEventListener("popstate",function(){renderView(true)});
 window.addEventListener("hashchange",function(){renderView(true)});
 renderView(false);
})();


/* THEME SWITCHER — saved across studio pages */
(function(){
 const root=document.documentElement,button=document.getElementById("themeToggle");
 if(!button)return;
 let saved="light";try{saved=localStorage.getItem("pv_theme")||"light"}catch(e){}
 function apply(theme){
  const dark=theme==="dark";root.dataset.theme=dark?"dark":"light";
  button.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
  button.title=dark?"Switch to light mode":"Switch to dark mode";
  button.querySelector(".theme-icon").textContent=dark?"☀":"☾";
 }
 apply(saved==="dark"?"dark":"light");
 button.addEventListener("click",function(){
  const next=root.dataset.theme==="dark"?"light":"dark";apply(next);
  try{localStorage.setItem("pv_theme",next)}catch(e){}
 });
})();

</script>
